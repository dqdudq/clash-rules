name: Sync geosite rules from MetaCubeX

on:
  schedule:
    - cron: '30 18 * * *'  # 02:30 Beijing time daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        run: python3 scripts/sync_geosite.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/geosite
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync geosite rules from MetaCubeX ($(date -u +%Y-%m-%d))"
            git push
          fi
