; ==========================================================
; DQ Clash Rules — 极简版（只做国家分组，规则最少）
; 用途：多机场合并订阅，只需要"按国家选节点"，不要任何服务/广告/流媒体分流
; 用法：
;   https://sub.dqhub.uk/sub?target=clash&config=https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/DQ_mini.ini&url=<机场1|机场2|...>&exclude=<假节点关键词>
; 仓库: https://github.com/dqdudq/clash-rules
;
; 设计取舍（为什么这么 mini）：
;  - 规则只有 4 条：内网直连 / 国内域名直连 / 国内 IP 直连 / 其余全走「🚀 手动」。
;    GEOSITE,CN + GEOIP,CN 用的是客户端自带的数据库，不依赖任何外部规则列表，
;    没有 404 / 卡死 / 过期风险，最稳、最通用。
;  - 不是"全局代理"：国内网站/IP 自动直连，只有国外流量走代理。
;  - 最后一条 MATCH = 漏网之鱼：没匹配到的（国外站）全部走「🚀 手动」，不会漏成直连。
;  - 国家组是 url-test（自动挑该国最快的），不区分优质/中转档——机场协议参差，交给测速就行。
;  - 「🌍 其他」是 select 不做 url-test：小语种国家每家机场常只有 1~2 个节点，测速没意义。
; ==========================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 分组 ----------
custom_proxy_group=🚀 手动`select`[]♻️ 自动`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇰🇷 韩国`[]🌍 其他`[]DIRECT
custom_proxy_group=♻️ 自动`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(?i)香港|hong ?kong|\bhkg?\b|🇭🇰`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)日本|japan|\bjp\b|东京|大阪|tokyo|osaka|🇯🇵`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)美国|united ?states|\busa?\b|洛杉矶|圣何塞|西雅图|los ?angeles|🇺🇸`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)新加坡|狮城|獅城|singapore|\bsg\b|🇸🇬`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(?i)台湾|臺灣|台灣|taiwan|\btw\b|🇹🇼`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国`url-test`(?i)韩国|韓國|首尔|korea|\bkr\b|seoul|🇰🇷`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 其他`select`(?i)英国|德国|法国|荷兰|加拿大|土耳其|印度|印尼|越南|泰国|马来|菲律宾|巴西|俄罗斯|阿根廷|乌克兰|united ?kingdom|\buk\b|germany|france|netherlands|canada|turkey|india|indonesia|vietnam|thailand|malaysia|philippines|brazil|russia

; ---------- 规则（就这 4 条，全靠客户端自带数据库，无外部依赖）----------
ruleset=DIRECT,[]GEOIP,PRIVATE,no-resolve
ruleset=DIRECT,[]GEOSITE,CN
ruleset=DIRECT,[]GEOIP,CN
ruleset=🚀 手动,[]MATCH
