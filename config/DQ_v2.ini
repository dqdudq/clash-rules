; ==========================================================
; DQ Clash Rules v2 — subconverter 规则模板（网页模式用）
; 地区组拆「优选 / 全选」；业务分组沿用 kyapi 的命名习惯。
; 用法：作为 &config= 传给 subconverter：
;   https://sub.dqhub.uk/sub?target=clash&config=<本文件raw地址>&url=<机场链接1|机场链接2>
; 仓库: https://github.com/dqdudq/clash-rules
;
; 说明：
;  - <地区>优选 = 只收带 E-/S- 档前缀的节点（kyapi 的优质线），不含 N 中转档
;  - <地区>全选 = 该地区所有机场的所有节点
;  - 纯 subconverter 无法按“来源机场”分优先级；要“主力机场优先”用本地覆写脚本
;    （config/v2/openclash-region-groups.overwrite.sh）
; ==========================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 地区组：优选(E/S档) + 全选(全部) ----------
custom_proxy_group=日本优选`url-test`(?i)E-日本|S-日本`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本全选`url-test`(?i)日本|Japan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国优选`url-test`(?i)E-美国|S-美国`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国全选`url-test`(?i)美国|United ?States`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡优选`url-test`(?i)E-新加坡|S-新加坡`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡全选`url-test`(?i)新加坡|狮城|獅城|Singapore`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港优选`url-test`(?i)E-香港|S-香港`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港全选`url-test`(?i)香港|Hong ?Kong`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾优选`url-test`(?i)E-台湾|S-台湾`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾全选`url-test`(?i)台湾|臺灣|台灣|Taiwan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=韩国优选`url-test`(?i)E-韩国|S-韩国`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=韩国全选`url-test`(?i)韩国|韓國|首尔|Korea`http://www.gstatic.com/generate_204`300,,50

; ---------- 入口 ----------
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]日本优选`[]美国优选`[]新加坡优选`[]香港优选`[]台湾优选`[]韩国优选`[]日本全选`[]美国全选`[]新加坡全选`[]香港全选`[]台湾全选`[]韩国全选`[]DIRECT

; ---------- 业务/服务（kyapi 命名） ----------
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]日本优选`[]美国优选`[]新加坡优选`[]香港优选`[]台湾优选`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]日本优选`[]美国优选`[]新加坡优选`[]香港优选`[]♻️ 自动选择
custom_proxy_group=💬 OpenAi`select`[]🚀 节点选择`[]美国优选`[]日本优选`[]新加坡优选`[]♻️ 自动选择
custom_proxy_group=💎 Gemini`select`[]🚀 节点选择`[]美国优选`[]日本优选`[]♻️ 自动选择
custom_proxy_group=💡 Claude`select`[]🚀 节点选择`[]美国优选`[]日本优选`[]♻️ 自动选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]日本优选`[]美国优选
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]日本优选`[]美国优选
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]DIRECT`[]日本优选`[]美国优选
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]日本优选`[]美国优选`[]新加坡优选
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ---------- 分流规则集 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

