; ==========================================================
; DQ Clash Rules — 自定义 subconverter 规则模板（SubHub「本站模板」）
; 结构对齐路由器 kyapi 增强版：节点/自动 → 服务组 → 业务组 → 国家组 → 功能组
; 用法：作为 &config= 传给 subconverter：
;   https://sub.dqhub.uk/sub?target=clash&config=https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/DQ_ACL4SSR.ini&url=<订阅链接>
; 仓库: https://github.com/dqdudq/clash-rules
;
; 说明：
;  - 国家组是 url-test，自动选该国延迟最低的节点（不做 N 中转档排除——subconverter
;    对否定预查正则会卡死；url-test 本来就会挑最快的，慢线自然不会被选中）
;  - 「主力机场优先」纯 subconverter 做不到，那个只有路由器本地覆写脚本能做
;    （config/v2/kyapi-router-enhanced.overwrite.sh）
; ==========================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 入口（面板最上）----------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ---------- 服务专组 ----------
custom_proxy_group=📺 油管`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=🏰 迪士尼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=🛒 亚马逊`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家`[]DIRECT

; ---------- 业务组 ----------
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]📺 油管`[]🏰 迪士尼`[]🛒 亚马逊`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]📺 油管`[]🏰 迪士尼`[]🛒 亚马逊`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=💬 OpenAi`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=💎 Gemini`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=💡 Claude`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本`[]🇺🇸 美国`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本`[]🇺🇸 美国`[]🇭🇰 香港`[]🇹🇼 台湾`[]🌍 其他国家

; ---------- 国家组（业务组之后）----------
; 简单"包含关键词"正则，不要 ^(?!.*N-).*$ 这类否定预查包通配——会让 subconverter std::regex 卡死
custom_proxy_group=🇯🇵 日本`url-test`(?i)日本|Japan|东京|大阪|名古屋|Tokyo|Osaka`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)美国|USA|United ?States|洛杉矶|圣何塞|西雅图|Los ?Angeles|San ?Jose|Seattle`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)新加坡|狮城|獅城|Singapore`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(?i)香港|Hong ?Kong|HongKong`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(?i)台湾|臺灣|台灣|Taiwan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 其他国家`select`(?i)韩国|韓國|首尔|Korea|英国|United ?Kingdom|\bUK\b|德国|Germany|法国|France|荷兰|Netherlands|加拿大|Canada|土耳其|Turkey|印度|India|印尼|Indonesia|越南|Vietnam|泰国|Thailand|马来|Malaysia|菲律宾|Philippines|巴西|Brazil|俄罗斯|Russia|乌克兰|Ukraine|阿根廷|Argentina

; ---------- 功能组 ----------
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ---------- 分流规则集 ----------
; ACL4SSR 管局域网 / 去广告 / 中国域名 / GFW 兜底；服务级走自建 geosite（每天自动同步）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

ruleset=📺 油管,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/youtube.list
ruleset=🏰 迪士尼,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/disney.list
ruleset=🛒 亚马逊,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/amazon.list
ruleset=🛒 亚马逊,[]DOMAIN-SUFFIX,primevideo.com
ruleset=🛒 亚马逊,[]DOMAIN-SUFFIX,amazonvideo.com

; Gemini：只收具体域名，别整段 google 都塞进来
ruleset=💎 Gemini,[]DOMAIN,gemini.google.com
ruleset=💎 Gemini,[]DOMAIN,aistudio.google.com
ruleset=💎 Gemini,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=💎 Gemini,[]DOMAIN-SUFFIX,makersuite.google.com
ruleset=💎 Gemini,[]DOMAIN-SUFFIX,bard.google.com
ruleset=💬 OpenAi,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/openai.list
ruleset=💡 Claude,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/anthropic.list

ruleset=📲 电报信息,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/telegram.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/apple.list

; 其余需代理的（github / 社交 / 通用 google / 一般被墙站）走「节点选择」
ruleset=🚀 节点选择,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/github.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/twitter.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/instagram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/facebook.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/google.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

