; ==========================================================
; DQ Clash Rules — 自定义 subconverter 规则模板
; 代理组结构自定义，规则集引用 ACL4SSR + blackmatrix7/ios_rule_script 两个上游
; 用法：作为 &config= 参数传给 subconverter，例如：
;   https://sub.dqhub.uk/sub?target=clash&config=https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/DQ_ACL4SSR.ini&url=<订阅链接>
; 仓库: https://github.com/dqdudq/clash-rules
; ==========================================================

[custom]
; ---------- 基础生成设置 ----------
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 代理组 ----------
; 类型: select(手动选择) / url-test(自动测速选优) / fallback / load-balance
; []X 表示直接引用节点或已定义分组；纯字符串表示按正则匹配节点名自动纳入
; 排列顺序（2026-08-05 调整）：业务/服务分组 → 地区节点选择 → 功能分组。
; 每个业务分组的可选项里直接铺平了六个主力地区+其他地区，不用先跳进"🚀 节点选择"二级菜单再选国家。

; ---------- 业务/服务分组 ----------
custom_proxy_group=📹 油管`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
; AI 服务合并成一个分组（2026-08-05：原按厂商拆 Google/Claude/OpenAI/其他AI 四个，改回合并，规则集仍分别引用各厂商 list）
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=🏢 Office全家桶`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=🐙 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=📱 社交媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区
custom_proxy_group=🛒 亚马逊`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区
custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT

; ---------- 地区节点选择 ----------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|\bHK\b|Hong ?Kong`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日本|\bJP\b|Japan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)美国|\bUS\b|United ?States`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(?i)新加坡|狮城|\bSG\b|Singapore`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)韩国|\bKR\b|Korea`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(?i)台湾|\bTW\b|Taiwan`http://www.gstatic.com/generate_204`300,,50
; 收纳零散小语种地区节点，select 手动选（不做 url-test）——这些国家在各机场里节点数量不稳定，有时只有 1~2 个，自动测速没意义。
; 用简单的"包含关键词"正则（跟上面 6 个主力地区同一种写法），不要用 ^(?!.*(...)).*$ 这种否定预查+通配包裹的写法——
; 曾在 2026-08-05 实测导致 subconverter 卡死（std::regex 对长串+多重alternation+lookahead的组合处理很差，
; 一次请求就把整个服务hang住，得手动 docker restart 才恢复）。新增国家直接往这行加关键词即可。
custom_proxy_group=🌍 其他地区`select`(?i)英国|UK|United ?Kingdom|德国|Germany|法国|France|荷兰|Netherlands|加拿大|Canada|土耳其|Turkey|印尼|Indonesia|印度|India|越南|Vietnam|泰国|Thailand|马来西亚|Malaysia|菲律宾|Philippines|巴西|Brazil|俄罗斯|Russia

; ---------- 功能分组 ----------
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ---------- 分流规则集（ruleset）----------
; 两个上游：ACL4SSR（局域网/去广告/中国域名/GFW兜底）+ blackmatrix7/ios_rule_script（分服务粒度更细，覆盖AI/GitHub/Office/游戏等）

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; 2026-08-05 起：以下服务级规则源改用自建 config/geosite/*.list（由 .github/workflows/sync-geosite.yml
; 每天自动从 MetaCubeX/meta-rules-dat 拉取转换，上游本身按天更新），替换掉停更超过一年的 blackmatrix7 对应文件
ruleset=📹 油管,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/youtube.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/google.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/anthropic.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/openai.list
ruleset=🏢 Office全家桶,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/microsoft.list
ruleset=🐙 GitHub,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/github.list
ruleset=📱 社交媒体,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/twitter.list
ruleset=📱 社交媒体,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/instagram.list
ruleset=📱 社交媒体,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/facebook.list
; 亚马逊：amazon.list 本身含 amazon.com 等 DOMAIN-SUFFIX 通配，Alexa智能音箱走的子域名也在其下，不用单独配置
ruleset=🛒 亚马逊,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/amazon.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/apple.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/nintendo.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/epicgames.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/playstation.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/geosite/xbox.list

ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
