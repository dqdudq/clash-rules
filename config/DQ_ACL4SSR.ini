; ==========================================================
; DQ Clash Rules — 自定义 subconverter 规则模板
; 基于 ACL4SSR 规则集（Ruleset），自定义代理组结构
; 用法：作为 &config= 参数传给 subconverter，例如：
;   https://sub.dqhub.uk/sub?target=clash&config=https://raw.githubusercontent.com/dqdudq/clash-rules/main/config/DQ_ACL4SSR.ini&url=<订阅链接>
; 仓库: https://github.com/dqdudq/clash-rules
; ==========================================================

[custom]
; ---------- 基础生成设置 ----------
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 代理组 ----------
; 类型: select(手动选择) / url-test(自动测速选优) / fallback / load-balance
; []X 表示直接引用节点或已定义分组；纯字符串表示按正则匹配节点名自动纳入

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🇨🇳 台湾节点`[]🌍 其他地区`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|\bHK\b|Hong ?Kong`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日本|\bJP\b|Japan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)美国|\bUS\b|United ?States`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(?i)新加坡|狮城|\bSG\b|Singapore`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)韩国|\bKR\b|Korea`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(?i)台湾|\bTW\b|Taiwan`http://www.gstatic.com/generate_204`300,,50
; 收纳零散小语种地区节点，select 手动选（不做 url-test）——这些国家在各机场里节点数量不稳定，有时只有 1~2 个，自动测速没意义。
; 用简单的"包含关键词"正则（跟上面 6 个主力地区同一种写法），不要用 ^(?!.*(...)).*$ 这种否定预查+通配包裹的写法——
; 曾在 2026-08-05 实测导致 subconverter 卡死（std::regex 对长串+多重alternation+lookahead的组合处理很差，
; 一次请求就把整个服务hang住，得手动 docker restart 才恢复）。新增国家直接往这行加关键词即可。
custom_proxy_group=🌍 其他地区`select`(?i)英国|UK|United ?Kingdom|德国|Germany|法国|France|荷兰|Netherlands|加拿大|Canada|土耳其|Turkey|印尼|Indonesia|印度|India|越南|Vietnam|泰国|Thailand|马来西亚|Malaysia|菲律宾|Philippines|巴西|Brazil|俄罗斯|Russia

custom_proxy_group=📹 油管`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🎥 奈飞`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=💬 AI平台`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ---------- 分流规则集（ruleset）----------
; 引用 ACL4SSR 官方维护的 Ruleset 列表，顺序: 局域网/去广告 → 特定平台 → 中国域名/IP直连 → 代理 → 兜底

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BanProgramAD.list
ruleset=📹 油管,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥 奈飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=💬 AI平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ChinaCompanyIp.list
ruleset=🐟 漏网之鱼,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL
